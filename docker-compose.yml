services:
  runtime:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/runtime
    ports: ['4002:4002']
    volumes:
      - ./runtime:/app/runtime
      - /app/runtime/node_modules
      - pnpm_store:/pnpm/store
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PORT=4002
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://samuel_db_user:pXos4q3JXjQPMHVN@pipelines.oib7xg1.mongodb.net/?appName=Pipelines
      - ACCOUNT_JWT_SECRET=dev-account-secret
      - EVENTS_URL=http://localhost:4013
    command: >
      sh -c "pnpm install --no-frozen-lockfile --config.allow-builds=true && pnpm dev"

  identity:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/identity
    ports: ['4010:4010']
    volumes:
      - ./identity:/app/identity
      - /app/identity/node_modules
      - pnpm_store:/pnpm/store
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PORT=4010
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://samuel_db_user:pXos4q3JXjQPMHVN@pipelines.oib7xg1.mongodb.net/?appName=Pipelines
      - USER_JWT_SECRET=dev-user-secret
      - ACCOUNT_JWT_SECRET=dev-account-secret
    command: >
      sh -c "pnpm install --no-frozen-lockfile --config.allow-builds=true && pnpm dev"

  management:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/management
    ports: ['4000:4000']
    depends_on: [identity]
    volumes:
      - ./management:/app/management
      - pnpm_store:/pnpm/store
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PORT=4000
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://samuel_db_user:pXos4q3JXjQPMHVN@pipelines.oib7xg1.mongodb.net/?appName=Pipelines
      - USER_JWT_SECRET=dev-user-secret
      - ACCOUNT_JWT_SECRET=dev-account-secret
      - IDENTITY_URL=http://identity:4010
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    command: >
      sh -c "pnpm install --no-frozen-lockfile --config.allow-builds=true && pnpm dev"

  storage:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/storage
    ports: ['4001:4001']
    volumes:
      - ./storage:/app/storage
      - /app/storage/node_modules
      - pnpm_store:/pnpm/store
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PORT=4001
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://samuel_db_user:pXos4q3JXjQPMHVN@pipelines.oib7xg1.mongodb.net/?appName=Pipelines
      - USER_JWT_SECRET=dev-user-secret
      - ACCOUNT_JWT_SECRET=dev-account-secret
    command: >
      sh -c "pnpm install --no-frozen-lockfile --config.allow-builds=true && pnpm dev"

  events:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/events
    ports: ['4013:4013']
    volumes:
      - ./events:/app/events
      - /app/events/node_modules
      - pnpm_store:/pnpm/store
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PORT=4013
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://samuel_db_user:pXos4q3JXjQPMHVN@pipelines.oib7xg1.mongodb.net/?appName=Pipelines
      - USER_JWT_SECRET=dev-user-secret
      - ACCOUNT_JWT_SECRET=dev-account-secret
    command: >
      sh -c "pnpm install --no-frozen-lockfile --config.allow-builds=true && pnpm dev"

  assets:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/assets
    ports: ['4012:4012']
    volumes:
      - ./assets:/app/assets
      - /app/assets/node_modules
      - pnpm_store:/pnpm/store
      - assets_uploads:/data/uploads
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PORT=4012
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://samuel_db_user:pXos4q3JXjQPMHVN@pipelines.oib7xg1.mongodb.net/?appName=Pipelines
      - USER_JWT_SECRET=dev-user-secret
      - ACCOUNT_JWT_SECRET=dev-account-secret
      - UPLOADS_DIR=/data/uploads
    command: >
      sh -c "pnpm install --no-frozen-lockfile --config.allow-builds=true && pnpm dev"

  studio:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/studio
    ports: ['4003:4003']
    depends_on: [management]
    volumes:
      - ./studio:/app/studio
      - /app/studio/node_modules
      - pnpm_store:/pnpm/store
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
    command: >
      sh -c "pnpm install && pnpm dev --host --port 4003"

volumes:
  pnpm_store:
  assets_uploads:

services:
  runtime:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/runtime
    ports: ['4002:4002']
    volumes:
      - ./runtime:/app/runtime
      - /app/runtime/node_modules
      - pnpm_store:/pnpm/store
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PORT=4002
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://samuel_db_user:pXos4q3JXjQPMHVN@pipelines.oib7xg1.mongodb.net/?appName=Pipelines
      - ACCOUNT_JWT_SECRET=dev-account-secret
    command: >
      sh -c "pnpm install --no-frozen-lockfile --config.allow-builds=true && pnpm dev"

  management:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/management
    ports: ['4000:4000']
    volumes:
      - ./management:/app/management
      - pnpm_store:/pnpm/store
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PORT=4000
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://samuel_db_user:pXos4q3JXjQPMHVN@pipelines.oib7xg1.mongodb.net/?appName=Pipelines
      - USER_JWT_SECRET=dev-user-secret
      - ACCOUNT_JWT_SECRET=dev-account-secret
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    command: >
      sh -c "pnpm install --no-frozen-lockfile --config.allow-builds=true && pnpm dev"

  storage:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/storage
    ports: ['4001:4001']
    volumes:
      - ./storage:/app/storage
      - /app/storage/node_modules
      - pnpm_store:/pnpm/store
      - storage_uploads:/data/uploads
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PORT=4001
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://samuel_db_user:pXos4q3JXjQPMHVN@pipelines.oib7xg1.mongodb.net/?appName=Pipelines
      - USER_JWT_SECRET=dev-user-secret
      - ACCOUNT_JWT_SECRET=dev-account-secret
      - UPLOADS_DIR=/data/uploads
    command: >
      sh -c "pnpm install --no-frozen-lockfile --config.allow-builds=true && pnpm dev"

  studio:
    image: guergeiro/pnpm:22-10-slim
    working_dir: /app/studio
    ports: ['4003:4003']
    depends_on: [management]
    volumes:
      - ./studio:/app/studio
      - /app/studio/node_modules
      - pnpm_store:/pnpm/store
    environment:
      - CI=true
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
    command: >
      sh -c "pnpm install && pnpm dev --host --port 4003"

volumes:
  pnpm_store:
  storage_uploads:

    <style>body { font-family: 'Outfit', sans-serif; margin: 0; background-color: #000; }</style>

        };

</head>
<body>
    <!-- Preloader -->
    <div id="preloader" style="position:fixed;inset:0;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#000;transition:opacity 0.5s ease,visibility 0.5s;">
        <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.08);border-top-color:#3b82f6;border-radius:50%;animation:preloader-spin 0.8s linear infinite;margin-bottom:28px;"></div>
        <div id="preloader-status" style="font-size:11px;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:20px;font-family:'Outfit',system-ui,sans-serif;">Iniciando...</div>
        <div style="width:180px;height:3px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;">
            <div id="preloader-bar" style="width:0%;height:100%;background:#3b82f6;border-radius:99px;transition:width 0.4s ease;"></div>
        </div>
        <div style="position:absolute;bottom:32px;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(253, 253, 253, 0.15);font-family:'Outfit',system-ui,sans-serif;">Construido con Pipelines</div>
    </div>
    <style>
        @keyframes preloader-spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <div id="root"></div>

    <!-- Dynamic Loader -->
    <script>
        (async function() {
            const scripts = [
                { src: "https://cdn.tailwindcss.com", name: "Tailwind" },
                { src: "./runtime.js", name: "Runtime" },
                { src: "./index.js", name: "App" }
            ];

            const status = document.getElementById("preloader-status");
            const bar = document.getElementById("preloader-bar");

            const delay = (ms) => new Promise(res => setTimeout(res, ms));
            const loadScript = (src) => new Promise((resolve, reject) => {
                const el = document.createElement("script");
                el.src = src;
                el.onload = resolve;
                el.onerror = reject;
                document.body.appendChild(el);
            });

            for (let i = 0; i < scripts.length; i++) {
                status.textContent = "Cargando " + scripts[i].name + "...";
                
                try {
                    // Promise.all permite que el delay "estilístico" de 600ms y la descarga ocurran al mismo tiempo
                    await Promise.all([
                        loadScript(scripts[i].src),
                        delay(600) 
                    ]);
                } catch (e) {
                    console.error("[Loader] Falló:", scripts[i].src);
                }

                const pct = Math.round(((i + 1) / scripts.length) * 100);
                bar.style.width = pct + "%";
            }

            status.textContent = "Listo";
            await delay(200);

            const preloader = document.getElementById("preloader");
            if (preloader) {
                preloader.style.opacity = "0";
                preloader.style.visibility = "hidden";
                setTimeout(() => preloader.remove(), 500);
            }
        })();
    </script>
</body>
</html>

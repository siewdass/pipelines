<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipelines | Acceso</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pipelines Runtime Bundle -->
    <script src="./dist/runtime.js"></script>
    <!-- Babel CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.1/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { Main, Icons, Theme, Authentication, Notification, Dialog } = window;
        const { useTheme } = Theme;
        const { useToast } = Notification;
        const { useAuth } = Authentication;
        
        const { FaArrowLeft, FaSun, FaMoon, FaUsers, FaProjectDiagram, FaDiagramProject, FaCheckCircle, FaExclamationTriangle, FaTriangleExclamation } = Icons;

        const App = () => {
            const { isLogged, signin, signout } = useAuth();
            const { show } = useToast();
            const [view, setView] = React.useState('landing');

            React.useEffect(() => {
                if (isLogged && view !== 'dashboard') {
                    setView('dashboard');
                }
            }, [isLogged]);

            if (view === 'dashboard' && isLogged) {
                return (
                    <Dashboard onSignOut={() => { signout(); setView('landing'); }} />
                );
            }

            if (view === 'login') {
                return (
                    <Login 
                        onBack={() => setView('landing')} 
                        onSuccess={() => setView('dashboard')} 
                    />
                );
            }

            return (
                <Landing onStart={() => setView('login')} />
            );
        };

        const Landing = ({ onStart }) => {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-4 bg-white dark:bg-slate-900 transition-colors">
                    <div className="max-w-4xl text-center">
                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full text-xs font-black uppercase tracking-widest mb-8 border border-blue-100 dark:border-blue-800">
                             <span className="relative flex h-2 w-2">
                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                                <span className="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                            </span>
                            v2.0 Runtime Ready
                        </div>

                        <h1 className="text-6xl md:text-8xl font-black text-slate-900 dark:text-white mb-6 tracking-tighter leading-none">
                            Tus <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">Procesos</span> <br/>en un solo lugar.
                        </h1>

                        <p className="text-xl md:text-2xl text-slate-500 dark:text-slate-400 font-medium mb-12 max-w-2xl mx-auto leading-relaxed">
                            Control total sobre tus datos y pipelines con una arquitectura modular y reactiva.
                        </p>

                        <div className="flex flex-col md:flex-row gap-4 justify-center">
                            <button 
                                onClick={onStart}
                                className="px-10 py-5 bg-slate-900 dark:bg-blue-600 text-white rounded-3xl font-bold text-lg hover:bg-black dark:hover:bg-blue-700 transition-all shadow-2xl shadow-slate-300 dark:shadow-blue-900/40 active:scale-95"
                            >
                                Iniciar Sesión
                            </button>
                            <button className="px-10 py-5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-3xl font-bold text-lg hover:border-slate-400 dark:hover:border-slate-500 transition-all active:scale-95">
                                Documentación
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Login = ({ onBack, onSuccess }) => {
            const { signin } = useAuth();
            const { show } = useToast();
            const [email, setEmail] = React.useState('admin@pipelines.com');
            const [password, setPassword] = React.useState('123456');
            const [loading, setLoading] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    await signin(email, password);
                    show("Sesión iniciada correctamente", "success");
                    onSuccess();
                } catch (err) {
                    show(err.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center px-4 bg-slate-50 dark:bg-slate-900">
                    <div className="w-full max-w-sm">
                        <button onClick={onBack} className="flex items-center gap-2 text-slate-400 hover:text-slate-900 dark:hover:text-white mb-8 font-bold transition-colors">
                            <FaArrowLeft className="w-5 h-5" /> Volver
                        </button>
                        
                        <div className="bg-white dark:bg-slate-800 p-8 rounded-[40px] shadow-2xl shadow-slate-200 dark:shadow-none border border-slate-100 dark:border-slate-700">
                            <div className="mb-8">
                                <h1 className="text-3xl font-black mb-2 leading-tight dark:text-white">Bienvenido</h1>
                                <p className="text-slate-400 font-medium">Ingresa tus credenciales para continuar.</p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-black uppercase text-slate-400 tracking-widest mb-2 ml-1">Email</label>
                                    <input 
                                        type="email" 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full px-6 py-4 bg-slate-50 dark:bg-slate-900/50 dark:text-white border border-slate-100 dark:border-slate-700 rounded-3xl focus:bg-white dark:focus:bg-slate-800 focus:border-blue-500 transition-all outline-none font-medium"
                                        placeholder="hola@ejemplo.com"
                                    />
                                </div>
                                <div className="pb-4">
                                    <label className="block text-xs font-black uppercase text-slate-400 tracking-widest mb-2 ml-1">Contraseña</label>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-6 py-4 bg-slate-50 dark:bg-slate-900/50 dark:text-white border border-slate-100 dark:border-slate-700 rounded-3xl focus:bg-white dark:focus:bg-slate-800 focus:border-blue-500 transition-all outline-none font-medium"
                                        placeholder="••••••••"
                                    />
                                </div>
                                
                                <button 
                                    disabled={loading}
                                    className="w-full py-5 bg-blue-600 text-white rounded-3xl font-bold text-lg hover:bg-blue-700 shadow-xl shadow-blue-200 dark:shadow-blue-900/40 transition-all active:scale-95 disabled:opacity-50 disabled:pointer-events-none"
                                >
                                    {loading ? 'Validando...' : 'Entrar'}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ onSignOut }) => {
            const { theme, toggleTheme } = useTheme();
            return (
                <div className="min-h-screen bg-slate-50 dark:bg-slate-900 transition-colors">
                    <div className="max-w-7xl mx-auto p-8">
                        <header className="flex justify-between items-center mb-12">
                            <div>
                                <h2 className="text-4xl font-black tracking-tight text-slate-900 dark:text-white">Panel de Control</h2>
                                <p className="text-slate-500 dark:text-slate-400 font-medium">Gestiona tus procesos en tiempo real.</p>
                            </div>
                            <div className="flex gap-4">
                                <button 
                                    onClick={toggleTheme}
                                    className="p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl shadow-sm hover:shadow-md transition-all active:scale-90"
                                >
                                    {theme === 'dark' ? <FaSun className="w-6 h-6 text-yellow-500" /> : <FaMoon className="w-6 h-6 text-slate-600" />}
                                </button>
                                <button 
                                    onClick={onSignOut}
                                    className="px-6 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl font-black text-xs uppercase tracking-widest text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 transition-colors"
                                >
                                    Salir
                                </button>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                            {[
                                { t: 'Usuarios', v: '1,248', i: FaUsers },
                                { t: 'Pipelines', v: '24', i: FaDiagramProject || FaProjectDiagram },
                                { t: 'Tasa Éxito', v: '99.4%', i: FaCheckCircle },
                                { t: 'Alertas', v: '0', i: FaTriangleExclamation || FaExclamationTriangle }
                            ].map((s, i) => (
                                <div key={i} className="bg-white dark:bg-slate-800 p-8 rounded-[40px] border border-slate-100 dark:border-slate-700 shadow-xl shadow-slate-200/50 dark:shadow-none transition-transform hover:-translate-y-1">
                                    <div className="w-10 h-10 bg-slate-50 dark:bg-slate-900/30 rounded-2xl flex items-center justify-center text-slate-400 dark:text-slate-500 mb-6 font-bold">
                                        {s.i && <s.i className="w-5 h-5" />}
                                    </div>
                                    <h3 className="text-xs font-black uppercase text-slate-400 tracking-widest mb-4">{s.t}</h3>
                                    <div className="text-4xl font-black text-slate-900 dark:text-white">{s.v}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const MainWrapper = () => (
            <Main>
                <App />
            </Main>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainWrapper />);
    </script>
</body>
</html>

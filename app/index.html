<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="dark:bg-gray-900">
    <div id="preloader" style="position: fixed; top: 0; left: 0; z-index: 999999; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; transition: opacity 0.5s ease-out, visibility 0.5s; background-color: var(--initial-bg, #ffffff);">
      <div style="width: 40px; height: 40px; border: 4px solid #465fff; border-top-color: transparent; border-radius: 50%; animation: initial-spin 1s linear infinite;"></div>
    </div>
    <style>
      @media (prefers-color-scheme: dark) { :root { --initial-bg: #111827; } }
      @keyframes initial-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
